# Self-contained AMS firmware updater -- one command per MODEL.
#
# Drop ams_flash.py into your Klipper config directory along with the artifact
# for each model you own, add
#   [include ams_flash.cfg]
# to printer.cfg (or put this file where your config already globs *.cfg), and
# FIRMWARE_RESTART. Then, from the console, with ONLY the unit being updated
# connected to the bridge:
#
#   AFC_BAMBU_AMS_UPDATE  MODE=check     # AMS 2 Pro: read-only, changes nothing
#   AFC_BAMBU_AMS_UPDATE                 # PREFLIGHT (probes, no erase)
#   AFC_BAMBU_AMS_UPDATE  MODE=go        # actually update (erases)
#
#   AFC_BAMBU_AMS1_UPDATE MODE=go        # same, for an AMS 1
#   AFC_BAMBU_HT_UPDATE   MODE=go        # same, for an AMS HT
#
# Full instructions: Firmwares/Bambu_AMS/AMS_FLASH_HOWTO.md
#
# ══ ONE COMMAND PER MODEL, AND THAT IS DELIBERATE. ══
#
# Each model has its own image and they are not interchangeable. Each command
# reads its own artifact file and checks, before anything is erased, that the
# file is that model's image, and that the one unit on the bus is that model
# (an AMS 1 and an AMS 2 are told apart by asking the unit itself):
#
#   AFC_BAMBU_AMS_UPDATE  -> ams2_artifact.json   (AMS 2 Pro; an older
#                                                  ams_artifact.json also works)
#   AFC_BAMBU_AMS1_UPDATE -> ams1_artifact.json   (AMS 1)
#   AFC_BAMBU_HT_UPDATE   -> ht_artifact.json     (AMS HT)
#
# Only ship the artifacts for models you actually have. A missing artifact is
# reported cleanly at step [2] and nothing is touched.
#
# LABEL is an optional log tag (e.g. the unit's sticker serial); it is not
# required and not validated. TARGET is only needed when the config has more
# than one bridge: the serial_port (or tcp://host:port) of the one to use.
# Output goes to logs/ams_flash.log.
#
# ════════════════════════════════════════════════════════════════════════
#  EDIT ONE LINE BEFORE THIS WORKS: the `command:` path below.
# ════════════════════════════════════════════════════════════════════════
#
# It must be the ABSOLUTE path to ams_flash.py. Klipper does not expand `~`
# and will not resolve a relative path.
#
# To find yours, SSH in and run:
#
#     ls -l ~/printer_data/config/ams_flash.py
#
# That prints the full path -- copy it verbatim into the `command:` line,
# after `/usr/bin/python3 `. On most installs only the username differs:
#
#     /home/pi/printer_data/config/ams_flash.py          Raspberry Pi OS
#     /home/mks/printer_data/config/ams_flash.py         MKS
#     /home/biqu/printer_data/config/ams_flash.py        BTT CB1 / Pi4B
#     /home/orangepi/printer_data/config/ams_flash.py    Orange Pi
#
# If the config lives somewhere else entirely, use whatever the `ls` printed.
#
# GET IT WRONG AND the update command fails immediately with a Python error
# like `can't open file ... No such file or directory` in the Klipper
# console. Nothing is sent to the AMS and nothing is erased -- a
# wrong path here is harmless, just non-functional.
#
# Nothing else needs a path: the artifacts are found beside ams_flash.py.
#
# Needs Klipper's gcode_shell_command component (Kalico has it built in; on
# stock Klipper install the gcode_shell_command extra).
#
# DETACHING: preflight/go stop Klipper, so the script first relaunches itself
# as its own systemd unit. It tries `systemd-run --user` (no password; needs
# lingering: `sudo loginctl enable-linger $USER`, once), then passwordless
# sudo, and only then a one-time password file: ams_sudo.pw beside
# ams_flash.py, used once and DELETED.
# `MODE=check` is read-only and needs none of this.

[gcode_shell_command ams_flash]
command: /usr/bin/python3 /home/pi/printer_data/config/ams_flash.py
timeout: 30
verbose: True

[gcode_macro AFC_BAMBU_AMS_UPDATE]
description: Update an AMS 2 Pro from the bridge. [MODE=check|preflight|go] [LABEL=<serial>] [TARGET=<port>]
gcode:
    {% set label = (params.LABEL | default('')) | string %}
    {% set mode = (params.MODE | default('preflight')) | string | lower %}
    {% if mode not in ['check', 'preflight', 'go'] %}
        { action_raise_error("MODE must be check, preflight, or go (got '%s')" % mode) }
    {% else %}
        {% set larg = (' --label ' ~ label) if (label | length > 0) else '' %}
        {% set target = (params.TARGET | default('')) | string %}
        {% set targ = (' --target ' ~ target) if (target | length > 0) else '' %}
        { action_respond_info("AMS 2 update (%s) started -- watch logs/ams_flash.log" % mode) }
        RUN_SHELL_COMMAND CMD=ams_flash PARAMS="--model ams2 --mode { mode }{ larg }{ targ }"
    {% endif %}

