# BridgeBox firmware updater -- one command, for any bridge AFC talks to.
#
# Put the firmware for your board (and its .manifest.json) in your Klipper
# config directory, the one that holds printer.cfg, add
#   [include bridgebox_flash.cfg]
# to printer.cfg (or put this file where your config already globs *.cfg), and
# RESTART. Then, from the console, with the printer idle:
#
#   BRIDGEBOX_FLASH BOARD=pico2              # CHECK: transfer + verify, keep
#                                            # running the old firmware
#   BRIDGEBOX_FLASH BOARD=pico2 MODE=go      # update: write, reboot onto it
#
#   BOARD=pico2   Pico 2 bridge (USB)          enc_flash_pico2.uf2
#   BOARD=s3      BridgeBox S3 (USB or WiFi)   signed_s3.bin
#
#   BRIDGEBOX_FLASH_ABORT                    # clear a stuck transfer
#
# Full instructions: Firmwares/BridgeBox/BRIDGE_FLASH_HOWTO.md
#
# ══ BOARD IS REQUIRED, AND THAT IS DELIBERATE. ══
#
# Each board has its own image, and naming the board is what picks it; the
# command does not guess. AFC_BAMBU_FLASH also reads the chip from the file
# and refuses an image for the wrong chip before a byte is sent, so a Pico
# image never reaches an S3 or the other way round. FILE=<name> overrides the
# file the board would use.
#
# UNIT picks the BRIDGE, not an AMS: any Bambu AMS unit on that bridge will
# do. With one AFC_BambuAMS unit in the config it is found by itself; with
# more, name one (UNIT=Bambu_AMS_1), because two units may sit on two bridges.
#
# MODE=check is the default because it changes nothing: the bridge receives
# the image, checks its signature and checksum, and throws it away. MODE=go is
# the same transfer followed by the write and a reboot; the link drops for
# about ten seconds and the AMS units come back by themselves. Confirm with
# AFC_BAMBU_UIDS: its firmware line is the proof.
#
# No shell access, no gcode_shell_command, no paths to edit: this only calls
# AFC_BAMBU_FLASH, which is part of AFC. AFC itself refuses to flash while a
# print is running or paused.

[gcode_macro BRIDGEBOX_FLASH]
description: Update a BridgeBox's firmware. BOARD=pico2|s3 [MODE=check|go] [UNIT=<AMS unit>] [FILE=<file>]
gcode:
    {% set files = {'pico2': 'enc_flash_pico2.uf2',
                    's3': 'signed_s3.bin'} %}
    {% set board = (params.BOARD | default('')) | string | lower %}
    {% set mode = (params.MODE | default('check')) | string | lower %}
    {% set file = (params.FILE | default(files[board] if board in files else '')) | string %}
    {% set units = [] %}
    {% for name in printer %}
        {% if name.startswith('AFC_BambuAMS ') %}
            {% set _ = units.append(name[13:]) %}
        {% endif %}
    {% endfor %}
    {% set unit = (params.UNIT | default(units[0] if units | length == 1 else '')) | string %}
    {% if board not in files and not params.FILE %}
        { action_raise_error("BRIDGEBOX_FLASH needs BOARD=pico2 or s3 (got '%s')" % board) }
    {% elif mode not in ['check', 'go'] %}
        { action_raise_error("MODE must be check or go (got '%s')" % mode) }
    {% elif unit | length == 0 %}
        { action_raise_error("BRIDGEBOX_FLASH: name the bridge with UNIT=<any AMS unit on it> -- this config has %d: %s" % (units | length, units | join(', '))) }
    {% else %}
        { action_respond_info("BridgeBox %s (%s) via %s: %s" % (mode, board or 'FILE', unit, file)) }
        AFC_BAMBU_FLASH UNIT={ unit } FILE={ file } APPLY={ 1 if mode == 'go' else 0 }
    {% endif %}

[gcode_macro BRIDGEBOX_FLASH_ABORT]
description: Drop a stuck BridgeBox firmware transfer. [UNIT=<AMS unit>]
gcode:
    {% set units = [] %}
    {% for name in printer %}
        {% if name.startswith('AFC_BambuAMS ') %}
            {% set _ = units.append(name[13:]) %}
        {% endif %}
    {% endfor %}
    {% set unit = (params.UNIT | default(units[0] if units | length == 1 else '')) | string %}
    {% if unit | length == 0 %}
        { action_raise_error("BRIDGEBOX_FLASH_ABORT: name the bridge with UNIT=<any AMS unit on it> -- this config has %d: %s" % (units | length, units | join(', '))) }
    {% else %}
        AFC_BAMBU_FLASH UNIT={ unit } ABORT=1
    {% endif %}
