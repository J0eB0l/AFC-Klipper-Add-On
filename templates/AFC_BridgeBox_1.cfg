# Stock Bambu Lab AMS units through a BridgeBox, as one pooled chain.
#
# Klipper talks to the BridgeBox over USB or WiFi. The BridgeBox is not an
# [mcu]: its port goes in serial_port below and nowhere else.
#
# [AFC_BridgeBox Chain_1] below is the only section you need. Units plugged
# in later get their lanes, T#s and panel entry with no restart.
#
# Before the first boot:
#   1. Copy this file to AFC/AFC_BridgeBox_1.cfg in your Klipper config
#      folder, where AFC's [include AFC/*.cfg] loads it.
#   2. Set extruder below. That extruder needs a toolhead sensor (see the
#      extruder note).
#   3. Settle pool_ams, the bay names and lane_base now: changing them
#      later can move lanes, and moved lanes lose their saved details.
# After boot:
#   4. AFC_BAMBU_UIDS lists the units on the bus and the bridge firmware;
#      AFC_BRIDGEBOX_BAYS shows the bay each unit claimed.
#
# The chain builds the unit, lane, hub, buffer and sensor sections itself.
# Write none of them for Bambu units, and keep your other sections off the
# Bambu lane numbers and bay names. There is no bowden length to set.
#
# The chain saves its state at the end of this file as lines starting with
# #~#. Leave them alone and keep your own lines above them.
#
# BridgeBoxes ship flashed. To update one, follow
# firmwares/BridgeBox/BRIDGE_FLASH_HOWTO.md with the signed_s3.bin or
# signed_c3.bin image (by the board's chip) and its .manifest.json from
# the same folder. The AMS units' own firmware
# updater is in firmwares/Bambu_AMS/.


[AFC_BridgeBox Chain_1]
# ---- Connection ----
# How Klipper reaches the BridgeBox. Klipper makes the link key and stores
# it on the BridgeBox by itself; there is no key to type.
#
# USB (default): auto finds the BridgeBox on USB and saves which one it
# took, so the chain keeps that board. A second chain on auto takes a
# BridgeBox no other chain uses. To move the chain to a replacement board,
# run AFC_BRIDGEBOX_FORGET_BOARD and RESTART. To name the port yourself
# instead, find it with:
#   ls /dev/serial/by-id/
serial_port: auto

# Move to WiFi with the cable still in: uncomment connection: wifi and run
# FIRMWARE_RESTART. Then join the BridgeBox's bb-bridge-XXXX hotspot from a
# phone and choose your network. Klipper sees it join, stores the link key
# on it and moves over by itself. While the cable is in, it falls back to
# USB whenever WiFi is down.
#connection: wifi
#
# If the hotspot page doesn't work for you, put the network here instead
# and Klipper gives it to the BridgeBox over USB. It is plain text, so keep
# this file private. Double quotes and backslashes can't be used.
#wifi_ssid: YOUR_NETWORK
#wifi_password: YOUR_PASSWORD

# WiFi with no cable at all: join the hotspot, choose your network, and the
# page shows the address the BridgeBox got. Put that address here in place
# of serial_port: auto; Klipper stores the link key on the first connect.
# Give the BridgeBox a fixed DHCP lease so it doesn't move.
#serial_port: tcp://BRIDGE_ADDRESS:8888

# Moving the BridgeBox to another printer or network: run
# AFC_BRIDGEBOX_RESET_WIFI. It forgets its network and key and brings its
# hotspot back.

# ---- Extruder ----
# The [AFC_extruder] this chain feeds. One chain feeds one extruder. The
# AMS feeds each load until that extruder's pin_tool_start sensor sees
# filament, so it needs one (or pin_tool_start: buffer, see buffer_type
# below). A second BridgeBox makes a second chain: add another
# [AFC_BridgeBox <name>] below this one, with its own serial_port and an
# extruder (serial_port: auto takes the BridgeBox no other chain uses). Its
# units are named Bambu_AMS_<name>_1 and so on by themselves; leave
# ams_names and ht_names out of it, or give it names of its own.
extruder: extruder

# ---- Pool ----
# Bays built at startup, counting units already recorded. pool_ams is the
# number of four-lane AMS bays (at most 4, the most a Bambu bus takes) and
# pool_ht the number of one-lane AMS HT bays (keep it at 8 or below). Set
# pool_ams to the most AMS you will run: raising it later moves every HT
# lane up.
pool_ams: 4
pool_ht: 8

# ---- Bay names ----
# Lowest lanes first. A name is what UNIT= takes in the AFC_BAMBU_*
# commands and what the panel shows. Unset, the bays are Bambu_AMS_1 to
# Bambu_AMS_4 and Bambu_AMS_HT_1 to Bambu_AMS_HT_8, and past the end of a
# list the default names carry on. Only four ams_names are used. Renaming
# or reordering them later can move a unit to other lanes.
ams_names: Bambu_AMS_1, Bambu_AMS_2, Bambu_AMS_3, Bambu_AMS_4
ht_names: Bambu_AMS_HT_1, Bambu_AMS_HT_2, Bambu_AMS_HT_3, Bambu_AMS_HT_4, Bambu_AMS_HT_5, Bambu_AMS_HT_6, Bambu_AMS_HT_7, Bambu_AMS_HT_8
# Prefix of the default names. Unset, it is Bambu_AMS, or
# Bambu_AMS_<chain name> on a second chain, so the two chains' names differ.
#unit_prefix: Bambu_AMS

# ---- Lanes and T# ----
# AMS bay N takes the four lanes from lane_base + 4 x (N - 1), and the HT
# bays follow the AMS band, one lane each. With a base of 0 and the default
# pools, Bambu_AMS_1 is lane0-lane3, Bambu_AMS_4 is lane12-lane15 and
# Bambu_AMS_HT_1 is lane16.
#
# T#s do not follow lane numbers: each lane takes the next unused T#. SET_MAP
# changes them like any lane's.
#
# lane_base 0 (the default) starts the Bambu lanes one past your other
# lanes. Set it before the first start: changing it later moves every Bambu
# lane, and those lanes lose their saved details.
#lane_base: 0

# ---- Known units ----
# A comma-separated list of <model>:<uid> pairs. The model is ams1 (AMS),
# ams2 (AMS 2 Pro), ht (AMS HT) or boxed (an AMS of either generation).
# Leave it unset: the chain records each unit it sees. When set, it
# replaces that record, and a unit it does not list still works but gets
# no saved bay. AFC_BAMBU_UIDS lists the UIDs on the bus.
#roster: ht:0123456789ABCDEF00003331

# ---- Unplugging ----
# Drop an unplugged unit's lanes and T#s live once it has been offline for
# release_grace seconds (minimum 2). Never during a print, and never while
# one of its lanes is loaded to the toolhead. With False (the default) they
# stay until the next restart.
auto_drop: True
#release_grace: 10

# ---- State file ----
# Where the #~# lines are kept. Default: the file that holds this section
# (found in your config folder), else
# ~/printer_data/config/AFC/AFC_BridgeBox_1.cfg.
#state_file:

# ---- Buffer ----
# The chain's buffer, [AFC_buffer <unit_prefix>_Buffer] (Bambu_AMS_Buffer
# by default), reads each AMS's own buffer. bambu (the default) can stand in
# for a toolhead filament sensor: use it with pin_tool_start: buffer in the
# [AFC_extruder] named above. FPS_PSF follows the tension only.
#buffer_type: bambu

# ---- Dryer ----
# Drying ceiling for every heated unit, in C. 0 (the default) uses each
# model's own: AMS 2 Pro 65, AMS HT 85. A higher value never raises it.
#dry_max_temp: 0

# ---- Unit options ----
# An [AFC_BambuAMS] option set here applies to every unit this chain
# builds; the model and bay sections below win over it. Keep unit_uid, ams_index
# and the mc_* options out of here: unit_uid stops Klipper, and the
# others address one unit, not a whole chain.
#
# Create a Spoolman spool for a tag Spoolman does not know yet. Needs the
# [AFC_BambuAMS_rfid] section below.
#auto_spoolman_create: False
#
# On a jam mid-print, unload, reload the same spool and resume the print.
# On by default for BridgeBox units; False leaves the print paused for you.
# auto_error_recovery_limit is how many resumes in a row it may make by
# itself before it leaves the print paused (0: recover the filament, but
# never resume).
#auto_error_recovery: True
#auto_error_recovery_limit: 1


# Settings for one model. Name the section after the model: ams1 (AMS),
# ams2 (AMS 2 Pro) or ht (AMS HT). A bay name, as in
# [AFC_BridgeBox Bambu_AMS_1], targets that bay alone. Most [AFC_BambuAMS]
# options can go here, and they win over the chain section. Never give
# these a serial_port: a section with one is another chain.
#
# measure_on_insert measures how much filament a spool holds when it is
# inserted. It is on by default for every model. Set it False here to turn
# it off for a model. AFC_BAMBU_CAPSCAN
# LANE=<lane> measures on demand either way.
#[AFC_BridgeBox ht]
#measure_on_insert: False

#[AFC_BridgeBox ams2]
#measure_on_insert: False

#[AFC_BridgeBox ams1]
#measure_on_insert: False


# ---- Spoolman ----
# The AMS reads Bambu tags itself, so the units load, scan and name their
# filament without this. The section adds the Spoolman side: matching the
# spool by its tag, and writing the remaining weight the AMS measures back
# to it (sync_measured_to_spoolman: False in the chain section stops
# that). Needs Spoolman set up in moonraker.conf.
#[AFC_BambuAMS_rfid]


# ---- Filament switch ----
# A filament switch on the chain's bus sends each of its two inlets to one
# of two extruders, so a lane can be loaded into either. Name what is
# plumbed into each inlet and the extruder each outlet feeds. The letters
# are the ones printed on the switch.
# A chain's units share its buffer, which feeds one inlet: name the chain
# there, and an AMS plugged into it later enters that inlet too. Any other
# unit goes by its own name.
# A chain can feed both inlets with a buffer on each: name the units behind
# the second buffer on the other inlet (inlet_b: Bambu_AMS_HT_1), and the
# chain makes them a buffer of their own.
# An inlet's units start on the extruder of the outlet with the same
# letter. A lane a print sends to the other extruder goes back once that
# print is over and the lane is out of its toolhead; one sent there at any
# other time stays. The outlet lengths are the tube from each outlet to its
# toolhead in mm; AFC_CALIBRATION measures them from its filament switch
# entry.
#   AFC_BRIDGEBOX_SWITCH_ASSIGN LANE=lane4 EXTRUDER=extruder1
#                               send a lane to the other extruder
#   AFC_BRIDGEBOX_SWITCH_ROUTE  show the inlets and outlets
#[AFC_BridgeBox_switch Switch_1]
#chain: Chain_1
#inlet_a: Chain_1
#inlet_b: Turtle_1
#outlet_a: extruder
#outlet_b: extruder1
#outlet_a_length: 850
#outlet_b_length: 1010


# ---- Drying and other commands ----
# Drying (AMS 2 Pro and AMS HT): templates/AFC_Dryer.cfg adds a web panel
# that finds every heated unit by itself. From the console:
#   AFC_BAMBU_HEATER_START UNIT=Bambu_AMS_HT_1 TEMP=65 TIME=480
#   AFC_BAMBU_HEATER_STOP UNIT=Bambu_AMS_HT_1
# TEMP is in C, capped at the unit's ceiling; TIME is in minutes.
#
#   AFC_BRIDGEBOX_ASSIGN  move a unit to another bay
#   AFC_BRIDGEBOX_FORGET  retire a unit and free its bay
