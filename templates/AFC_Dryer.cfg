# AFC Unit Heaters: one web panel for every filament dryer on this machine.
#
# Units are auto-detected from the [AFC_BambuAMS] / [AFC_ACE] / [AFC_ACE2]
# sections already in your config, so there is nothing to list here: an AMS 2
# Pro, an AMS HT and an ACE all appear on their own, each drawn to match its
# hardware and capped at its own temperature ceiling (ACE 55 C, AMS 2 Pro 65 C,
# AMS HT 85 C). A unit with no heater is hidden unless show_heaterless is set.
#
# To see it in Mainsail/Fluidd: Settings -> Webcams -> Add,
#   Service:  iframe
#   URL:      http://<this-printer's-host-or-IP>:8093/
# An iframe "camera" is the only way to embed an interactive panel in either
# UI, neither of which has a plugin API. It is also just a web page, so that
# URL works on its own in any browser or on a phone.
#
# AFC_DRYER_STATUS prints where it is served and which units it found; run it
# first if the panel is empty.

[afc_dryer]
port: 8093
bind: 0.0.0.0
# poll: 2.0                # seconds between status snapshots
# show_heaterless: True    # also list dryer-less units (e.g. a plain AMS 1),
#                          # read-only, so the panel shows the whole machine
