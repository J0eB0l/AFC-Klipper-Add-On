# BoxTurtle on its own USB firmware (boxturtle_fw on the AFC-Lite)
#
# The AFC-Lite runs the lanes, espoolers, TurtleNeck and LEDs itself and
# talks to AFC over USB, the way an ACE does. There is no [mcu] section and
# no pins in this file, and unplugging the Turtle never shuts Klipper down:
# a print feeding from it pauses, and it picks up again when plugged back in.
#
# Before the first boot:
#   1. Flash firmwares/BoxTurtleUSB/boxturtle.bin on the AFC-Lite. It
#      shows up as /dev/serial/by-id/usb-AFC_BoxTurtle_<chip serial>-if00.
#   2. Set hub, extruder and each lane's dist_hub below.
#   3. Pick the buffer: the TurtleNeck on the AFC-Lite is used unless you
#      name another one (see buffer and turtleneck below).
# After boot:
#   4. AFC_TURTLE_STATUS UNIT=Turtle_1 shows the link, the firmware and the
#      switches.
#   5. Calibrate with AFC_CALIBRATION like any BoxTurtle.

[AFC_BoxTurtleUSB Turtle_1]
hub: Turtle_1
extruder: extruder
serial_port: auto          # or the /dev/serial/by-id/ path of the board
#serial_port: tcp://192.168.1.50  # a board on a BridgeHub (port 4001), or tcp://<ip>:<port> for another raw TCP serial server, by IP address
#tcp_key: <key>            # a BridgeHub's link key; unset, AFC makes one and saves it in AFC.var.hub
#serial_uid: <chip serial> # with auto, picks one board when several are plugged in
enable_assist: True        # espooler assist while printing
enable_kick_start: True    # full speed espoolers for kick_start_time first

# ---- Buffer ----
# The TurtleNeck on the AFC-Lite is used unless a buffer is named. For a
# buffer on a Klipper MCU, such as an analog PSF (AFC_FPS.cfg) or a
# TurtleNeck wired to another board, name it here or on a lane. To use the
# buffer named on the [AFC_extruder] instead, set turtleneck: False.
#buffer: <buffer_name>
#turtleneck: True
# The onboard TurtleNeck's settings, like an [AFC_buffer]:
#multiplier_high: 1.05
#multiplier_low: 0.95
#filament_error_sensitivity: 0   # 0-10, 0 turns the clog check off

# ---- Lane drivers (each [AFC_lane] can override these) ----
#rotation_distance: 4.65
#microsteps: 16
#invert_dir: True
#run_current: 0.8
#print_current: <current while printing>
#sense_resistor: 0.110

# ---- LEDs on the board ----
# The AFC-Lite's RGB1-RGB4 headers: how many LEDs each one drives (0 = none)
# and their color order (GRB, GRBW, RGB or RGBW). The defaults are the stock
# BoxTurtle wiring: one GRBW LED per lane on RGB1.
#rgb1_chain_count: 4
#rgb1_color_order: GRBW
#rgb2_chain_count: 0
#rgb2_color_order: GRB
#rgb3_chain_count: 0
#rgb3_color_order: GRB
#rgb4_chain_count: 0
#rgb4_color_order: GRB

# There is no hub pin: the board reads the hub switch.
[AFC_hub Turtle_1]
afc_bowden_length: 1725    # AFC_CALIBRATION measures this
move_dis: 75
cut: False

[AFC_lane lane1]
unit: Turtle_1:1
dist_hub: 155.0
park_dist: 10
# This lane's LEDs: RGB<header>:<first>[-<last>], comma separated for more
# than one range. Without it, lane N uses LED N on RGB1.
#turtle_led: RGB1:1

[AFC_lane lane2]
unit: Turtle_1:2
dist_hub: 80.0
park_dist: 10
#turtle_led: RGB1:2

[AFC_lane lane3]
unit: Turtle_1:3
dist_hub: 90.0
park_dist: 10
#turtle_led: RGB1:3

[AFC_lane lane4]
unit: Turtle_1:4
dist_hub: 145.0
park_dist: 10
#turtle_led: RGB1:4
