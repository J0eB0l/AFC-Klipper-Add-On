# Blank-tag writer: put an RFID tag on a third-party spool.
#
# Mainsail and Fluidd render a macro's parameters as INPUT FIELDS in the macro
# panel (they parse `params.X|default(...)` out of the config), which is what
# makes this a fill-in form with a write button rather than a typed command.
# The prompt dialogs used elsewhere in AFC cannot do this: `prompt_text` is a
# line of static text and `prompt_button` is a fixed choice, so neither can
# take a brand name or a colour.
#
# WHICH READER. Every unit with a host-side reader offers its readers to this
# one command -- BoxTurtle, ACE2, ViViD and OpenAMS alike. Run AFC_RFID_READERS
# for the list and whether each is online; the names look like `bt:reader0`,
# `oams:rfid_a`, `vivid:reader0`, `ace2:slot0`. READER= takes any of them, and
# the bare half (`rfid_a`) works too when only one unit has a reader by that
# name. With exactly one reader on the printer, READER= can be left out.
#
# THE SPOOL ON A LANE. Give LANE= and the unit finds the tag itself, the same
# pull-in its scan does (Box Turtle, ACE 2, OpenAMS): it turns the spool until
# the tag stops at the reader, writes it there, puts the filament back, and the
# lane takes the new tag. LANE= also picks the reader, so READER= can be left
# out. A blank tag on a fresh spool is inserted, gets lane defaults, then
# AFC_TAG_WRITE_SPOOL LANE=lane4 SPOOL=153 writes and applies it. Without
# LANE=, hold the sticker on the antenna and name the READER=.
#
# TWO WAYS TO USE IT.
#
#   AFC_TAG_WRITE_SPOOL SPOOL=136
#     Everything comes from the Spoolman record -- brand, material, colour,
#     diameter, density, temperatures and the exact weight -- and the tag's UID
#     is written back to that spool afterwards, so the next scan resolves
#     straight to it. This is the one to use if the spool is already in
#     Spoolman, which is where AFC reads its filament data from anyway.
#
#   AFC_TAG_WRITE BRAND=Polymaker TYPE=PLA COLOR=1A1A1A WEIGHT=1000
#     Everything typed in. No Spoolman record needed or created.
#
# WHAT IT WRITES. A blank NTAG sticker: the Anycubic layout, which every
# host-side AFC reader (BoxTurtle, ACE2, ViViD, OpenAMS) already decodes, plus
# an AFC block at page 32 carrying the exact weight, the Spoolman spool id,
# density and drying settings -- the things the Anycubic layout has no room
# for. BRAND is free text on the tag: set it to whoever really made the
# filament. The layout is a container, not a claim about the manufacturer.
#
# WHAT IT CANNOT WRITE. Bambu and Snapmaker tags are MIFARE Classic behind
# per-tag derived keys, and a Bambu AMS will not read an NTAG at all. This
# writes spools for the host-side readers, not for an AMS.

[gcode_macro AFC_TAG_WRITE]
description: Write a blank NTAG sticker for a third-party spool. Give LANE to have the unit pull the spool's tag to the reader, or hold the sticker on the antenna. ex. `AFC_TAG_WRITE LANE=lane9 BRAND=Polymaker TYPE=PLA COLOR=1A1A1A WEIGHT=1000`
gcode:
  {% set brand = params.BRAND|default('Generic')|string %}
  {% set type = params.TYPE|default('PLA')|string %}
  {% set color = params.COLOR|default('FFFFFF')|string %}
  {% set weight = params.WEIGHT|default(1000)|int %}
  {% set diameter = params.DIAMETER|default(1.75)|float %}
  {% set density = params.DENSITY|default(1.24)|float %}
  {% set sku = params.SKU|default('')|string %}
  {% set hotend_min = params.HOTEND_MIN|default(190)|int %}
  {% set hotend_max = params.HOTEND_MAX|default(230)|int %}
  {% set bed = params.BED|default(60)|int %}
  {% set reader = params.READER|default('')|string %}
  {% set lane = params.LANE|default('')|string %}

  {% set rd = 'READER=' ~ reader ~ ' ' if reader != '' else '' %}
  {% set ln = 'LANE=' ~ lane ~ ' ' if lane != '' else '' %}
  AFC_RFID_WRITE {rd}{ln}BRAND="{brand}" TYPE="{type}" SKU="{sku}" COLOR={color} WEIGHT={weight} DIAMETER={diameter} DENSITY={density} HOTEND_MIN={hotend_min} HOTEND_MAX={hotend_max} BED={bed}

[gcode_macro AFC_TAG_WRITE_SPOOL]
description: Write a blank NTAG sticker from a Spoolman spool, then bind the tag's UID back to that spool so the next scan resolves to it. Give LANE to have the unit pull the spool's tag to the reader. ex. `AFC_TAG_WRITE_SPOOL LANE=lane4 SPOOL=136`
gcode:
  {% set spool = params.SPOOL|default(0)|int %}
  {% set reader = params.READER|default('')|string %}
  {% set lane = params.LANE|default('')|string %}

  {% set rd = ' READER=' ~ reader if reader != '' else '' %}
  {% set ln = ' LANE=' ~ lane if lane != '' else '' %}
  {% if spool == 0 %}
    { action_respond_info("AFC_TAG_WRITE_SPOOL: give SPOOL=<spoolman id>. Use AFC_TAG_WRITE to type the fields in instead.") }
  {% else %}
    AFC_RFID_WRITE SPOOL={spool}{rd}{ln}
  {% endif %}

[gcode_macro AFC_TAG_READERS]
description: List every RFID reader that can write a tag, and whether each is online. Use the names with READER= on AFC_TAG_WRITE.
gcode:
  AFC_RFID_READERS

[gcode_macro AFC_ENROLL_TAG]
description: Enroll a tag into Spoolman - create (or link) a spool, write the tag, bind its UID. Set SPOOL to link an existing spool, or leave it empty to create one from the fields. Pass LANE so a spool reader spins the tag into range. ex. `AFC_ENROLL_TAG READER=bt:reader0 LANE=lane11 SPOOL=42` or `AFC_ENROLL_TAG READER=bt:reader0 LANE=lane11 BRAND=Inland TYPE=PLA COLOR=F20808 WEIGHT=1000`
gcode:
  {% set reader = params.READER|default('')|string %}
  {% set spool = params.SPOOL|default(0)|int %}
  {% set brand = params.BRAND|default('Generic')|string %}
  {% set type = params.TYPE|default('PLA')|string %}
  {% set color = params.COLOR|default('FFFFFF')|string %}
  {% set weight = params.WEIGHT|default(1000)|int %}
  {% set diameter = params.DIAMETER|default(1.75)|float %}
  {% set density = params.DENSITY|default(1.24)|float %}
  {% set sku = params.SKU|default('')|string %}
  {% set hotend_max = params.HOTEND_MAX|default(230)|int %}
  {% set bed = params.BED|default(60)|int %}
  {% set lane = params.LANE|default('')|string %}

  {% set rd = 'READER=' ~ reader if reader != '' else '' %}
  {% set ln = ' LANE=' ~ lane if lane != '' else '' %}
  {% if spool > 0 %}
    AFC_RFID_ENROLL {rd}{ln} SPOOL={spool}
  {% else %}
    AFC_RFID_ENROLL {rd}{ln} BRAND="{brand}" TYPE="{type}" SKU="{sku}" COLOR={color} WEIGHT={weight} DIAMETER={diameter} DENSITY={density} HOTEND_MAX={hotend_max} BED={bed}
  {% endif %}
