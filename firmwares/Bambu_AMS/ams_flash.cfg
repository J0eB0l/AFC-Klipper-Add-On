# The AMS updater: writes Bambu's own firmware into a Bambu AMS 1, AMS 2 Pro or
# AMS HT on a BridgeBox, while Klipper keeps running.
#
# Put ams_flash.py, ams_firmware.json and this file in one folder in your
# Klipper config, e.g. ~/printer_data/config/ams_firmware/, add
#   [include ams_firmware/ams_flash.cfg]
# to printer.cfg, set the `command:` path below, and FIRMWARE_RESTART.
#
# Then update a unit from the Flash AMS menu:
#
#   AFC_BAMBU_FIRMWARE
#
# It lists your units and their firmware, then the newest Bambu images for the
# unit you pick, and runs the update. Bambu's image is downloaded when the
# update starts. Without internet, put Bambu's .bin.sig file or offline update
# package (.zip) in the same folder and the menu lists it.
#
# Full instructions: AMS_FLASH_HOWTO.md
#
# The one line to edit: `command:` must be the ABSOLUTE path to ams_flash.py.
# Klipper does not expand `~` and does not resolve a relative path. To find
# yours, run over SSH:
#
#     ls -l ~/printer_data/config/ams_firmware/ams_flash.py
#
# and copy the full path after `/usr/bin/python3 `. A wrong path only makes the
# update fail at once with "can't open file"; nothing is sent to the AMS.
#
# Needs Klipper's gcode_shell_command (Kalico has it built in; on Klipper,
# install the gcode_shell_command extra, as KIAUH does).
#
# The update runs on its own, so it outlives this shell command's timeout.
# Restarting the Klipper service during an update stops it; run the update
# again to finish the unit.

[gcode_shell_command ams_flash]
command: /usr/bin/python3 /home/pi/printer_data/config/ams_firmware/ams_flash.py
timeout: 60
verbose: True
